# Przepływ serwera DNS (BIND) – zespół DNS, WojakNet
# Etap 3: testy (CI), budowanie i publikacja obrazu, wdrożenie TEST -> PROD (po zatwierdzeniu).
name: DNS CI/CD

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
    # Filtr ścieżek dotyczy tylko pushy na gałęzie (dla tagów GitHub go nie stosuje)
    paths:
      - 'bind-config/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/**'
      - '.github/skrypty/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '24 20 * * *'

permissions:
  contents: read

env:
  IP_PROD: 192.168.56.54   # oczekiwany adres www.wojak.lan i rekordu PTR w testach

jobs:
  # ---------- CI: testy na runnerach GitHub ----------
  sprawdz-konfiguracje:
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: named-checkconf
            polecenie: named-checkconf /etc/bind/named.conf
          - test: named-checkzone wojak.lan
            polecenie: named-checkzone wojak.lan /etc/bind/db.wojak.lan
          - test: named-checkzone 56.168.192.in-addr.arpa
            polecenie: named-checkzone 56.168.192.in-addr.arpa /etc/bind/db.56.168.192
    steps:
      - uses: actions/checkout@v7
      - name: Instalacja narzędzi BIND
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bind9-utils
      - name: Kopiowanie konfiguracji do /etc/bind
        run: sudo mkdir -p /etc/bind /var/cache/bind && sudo cp bind-config/* /etc/bind/
      - name: ${{ matrix.test }}
        run: ${{ matrix.polecenie }}

  kontrola-soa:
    name: Kontrola numeru seryjnego SOA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # pełna historia – potrzebna do porównania z wcześniejszą wersją
      - name: Porównanie numerów seryjnych
        env:
          ZDARZENIE: ${{ github.event_name }}
          REF_TYP: ${{ github.ref_type }}
          PRZED: ${{ github.event.before }}
          GALAZ_DOCELOWA: ${{ github.base_ref }}
        run: |
          # numer seryjny = 3. pole po słowie SOA (po usunięciu komentarzy i nawiasów)
          serial() { sed 's/;.*//' | tr -d '()' | tr '\n' ' ' | awk '{for(i=1;i<=NF;i++) if($i=="SOA"){print $(i+3); exit}}'; }

          case "$ZDARZENIE" in
            pull_request)
              BAZA="origin/$GALAZ_DOCELOWA" ;;
            push)
              if [ "$REF_TYP" = "tag" ]; then echo "Tag Git - kontrola pominięta"; exit 0; fi
              if [ -z "$PRZED" ] || [ "$PRZED" = "0000000000000000000000000000000000000000" ]; then
                echo "Pierwszy push nowej gałęzi - kontrola pominięta"; exit 0
              fi
              BAZA="$PRZED" ;;
            *)
              echo "Zdarzenie $ZDARZENIE - kontrola pominięta"; exit 0 ;;
          esac

          if ! git cat-file -e "$BAZA^{commit}" 2>/dev/null; then
            echo "::warning::Brak commita bazowego $BAZA - kontrola pominięta"; exit 0
          fi
          echo "Porównanie z: $BAZA ($(git rev-parse --short "$BAZA"))"

          BLAD=0
          for PLIK in bind-config/db.*; do
            if ! git cat-file -e "$BAZA:$PLIK" 2>/dev/null; then echo "$PLIK: nowa strefa - pominięta"; continue; fi
            if git diff --quiet "$BAZA" HEAD -- "$PLIK"; then echo "$PLIK: bez zmian"; continue; fi
            STARY=$(git show "$BAZA:$PLIK" | serial)
            NOWY=$(serial < "$PLIK")
            echo "$PLIK: zmieniony, serial przed = $STARY, po = $NOWY"
            if [ "$NOWY" -le "$STARY" ]; then
              echo "::error file=$PLIK::Plik strefy zmieniony bez zwiększenia numeru seryjnego SOA ($STARY -> $NOWY)"
              BLAD=1
            fi
          done
          exit $BLAD

  hadolint:
    name: Analiza Dockerfile (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  # ---------- CD: budowanie i publikacja obrazu ----------
  budowanie:
    name: Budowanie i publikacja obrazu
    needs: [sprawdz-konfiguracje, kontrola-soa, hadolint]
    # main (push, harmonogram) lub tag v*.*.* – nigdy pull_request ani inne gałęzie
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      obraz: ${{ steps.tagi.outputs.obraz }}
      tag: ${{ steps.tagi.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # potrzebne do sprawdzenia, czy tag Git wskazuje commit z main

      - name: Logowanie do Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Wyznaczenie tagów obrazu
        id: tagi
        env:
          OBRAZ: ${{ vars.DOCKERHUB_LOGIN }}/dns_wojak
          REF_TYP: ${{ github.ref_type }}
          REF_NAZWA: ${{ github.ref_name }}
        run: |
          TAG="b${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "obraz=$OBRAZ" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tag unikalny: $TAG"

          # Ponowienie przebiegu (re-run) ma ten sam numer – istniejącego tagu nie nadpisujemy
          if docker buildx imagetools inspect "$OBRAZ:$TAG" > /dev/null 2>&1; then
            echo "Obraz $OBRAZ:$TAG już istnieje - zostanie użyty bez ponownej publikacji"
            echo "istnieje=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "istnieje=false" >> "$GITHUB_OUTPUT"

          LISTA="$OBRAZ:$TAG"
          if [ "$REF_TYP" = "tag" ]; then
            WERSJA="${REF_NAZWA#v}"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $REF_NAZWA nie wskazuje commita z gałęzi main"; exit 1
            fi
            if docker buildx imagetools inspect "$OBRAZ:$WERSJA" > /dev/null 2>&1; then
              echo "::error::Wersja $WERSJA już istnieje w Docker Hub - ponowna publikacja jest niedozwolona"; exit 1
            fi
            LISTA="$LISTA,$OBRAZ:$WERSJA"
          else
            LISTA="$LISTA,$OBRAZ:latest"   # main (push lub harmonogram)
          fi
          echo "lista=$LISTA" >> "$GITHUB_OUTPUT"
          echo "Publikowane tagi: $LISTA"

      - name: Przygotowanie buildx
        if: steps.tagi.outputs.istnieje != 'true'
        uses: docker/setup-buildx-action@v4.4.1

      - name: Budowanie i publikacja
        if: steps.tagi.outputs.istnieje != 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.tagi.outputs.lista }}
          # Harmonogram: aktualny obraz bazowy i bez cache (poprawki bezpieczeństwa)
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: ${{ github.event_name != 'schedule' && 'type=gha' || '' }}
          cache-to: type=gha,mode=max

      - name: Przekazanie tagu przez outputs
        run: |
          echo "Obraz dla kolejnych zadań: ${{ steps.tagi.outputs.obraz }}:${{ steps.tagi.outputs.tag }}"

  # ---------- CD: wdrożenia na self-hosted runnerach ----------
  # Zabezpieczenie: zadania na self-hosted wyłącznie dla main i zdarzeń push / schedule
  # (nigdy pull_request – kod z PR, także z forków, nie trafia na serwery TEST/PROD).
  wdrozenie-test:
    name: Wdrożenie na TEST
    needs: budowanie
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: [self-hosted, test_wojak]
    environment: Testowe
    concurrency:
      group: dns-Testowe
      cancel-in-progress: false
    env:
      OBRAZ: ${{ needs.budowanie.outputs.obraz }}
      TAG: ${{ needs.budowanie.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Wdrożenie obrazu (docker compose)
        run: |
          echo "Wdrażany obraz: $OBRAZ:$TAG"
          docker compose pull
          docker compose up -d
      - name: Test po wdrożeniu (A, PTR, SOA)
        run: bash .github/skrypty/test_dns.sh "${{ vars.SERWER_IP }}"

  wdrozenie-prod:
    name: Wdrożenie na PROD
    needs: [budowanie, wdrozenie-test]
    # Harmonogram wdraża tylko na TEST; na PROD wyłącznie push do main (po zatwierdzeniu)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, prod_wojak]
    environment: Produkcyjne
    concurrency:
      group: dns-Produkcyjne
      cancel-in-progress: false
    env:
      OBRAZ: ${{ needs.budowanie.outputs.obraz }}
      TAG: ${{ needs.budowanie.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Wdrożenie obrazu (docker compose)
        run: |
          echo "Wdrażany obraz: $OBRAZ:$TAG"
          docker compose pull
          docker compose up -d
      - name: Test po wdrożeniu (A, PTR, SOA)
        run: bash .github/skrypty/test_dns.sh "${{ vars.SERWER_IP }}"